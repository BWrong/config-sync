name: ci

# PR 与 push 上跑测试、格式、clippy 和前端 build。
# 出包（Tauri / dmg）仍只由 release.yml 的 v* tag 触发，这里不打包。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    # 单独成 job：格式红了要单独可见，不连带把 clippy / test 的结论弄混。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt

      # #28 之后基线已干净（PR #25 时那 29 个历史文件已格式化），故意不做 continue-on-error。
      - run: cargo fmt --all --check

  rust:
    # 与 release.yml 同环境：Tauri 在 Linux 上还要额外装 webkit2gtk，macOS runner 自带。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      # --locked：CI 严格按 Cargo.lock 解析，不让依赖在流水线里漂移。
      - run: cargo test --workspace --locked

      # --all-targets 覆盖测试代码；先不带 `-D warnings`：历史 clippy 告警仍在（lib 2 条：paths.rs:50、resolve.rs:55；
      # 测试代码 16 处，共 18 处），清完了再收紧成门禁。
      - run: cargo clippy --workspace --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 与 release.yml 一致
          cache: npm

      - run: npm ci

      - run: npm run build
